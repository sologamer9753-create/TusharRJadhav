<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Tushar R. Jadhav</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; background: #0a0a0a; color: #00ff41; font-family: 'VT323', monospace; }
    body { display: flex; align-items: center; justify-content: center; }
    .error-container { text-align: center; padding: 2rem; }
    .glitch { font-size: clamp(4rem, 15vw, 8rem); text-shadow: 2px 0 #ff0040, -2px 0 #00ffff; animation: glitch 600ms infinite; }
    @keyframes glitch { 0%{transform:translate(0)} 20%{transform:translate(-3px,3px)} 40%{transform:translate(3px,-3px)} 60%{transform:translate(-2px,2px)} 80%{transform:translate(2px,-2px)} 100%{transform:translate(0)} }
    .sub { font-size: clamp(1rem, 4vw, 1.5rem); margin: 1rem 0 2rem; opacity: .8; }
    .prompt { color: #888; }
    .prompt span { color: #00ff41; }
    a { color: #00ff41; text-decoration: none; border: 1px solid #00ff41; padding: .5rem 1.5rem; transition: .3s; display: inline-block; margin-top: 1rem; }
    a:hover { background: #00ff41; color: #0a0a0a; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #boot-overlay { display: none !important; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="glitch">404</div>
    <div class="sub">FILE NOT FOUND — the page you're looking for doesn't exist or has been moved.</div>
    <div class="prompt">C:\USERS\YOU&gt; <span>cd&nbsp;home</span><span class="blink">_</span></div>
    <a href="/">> cd ~/portfolio</a>
  </div>
</body>
</html>
